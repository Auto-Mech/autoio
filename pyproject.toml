[project]
name = "autoio"
version = "0.2026.0"
description = "I/O interfaces for external codes used by AutoMech"
readme = "README.md"
dependencies = []
requires-python = ">= 3.11"

[dependency-groups]
test = ["pytest"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Hatchling configurations
[tool.hatch.build.targets.wheel]
packages = [
    "src/autoparse",
    "src/autoread",
    "src/autorun",
    "src/autowrite",
    "src/chemkin_io",
    "src/elstruct",
    "src/intder_io",
    "src/ioformat",
    "src/mess_io",
    "src/nst_io",
    "src/onedmin_io",
    "src/pac99_io",
    "src/polyrate_io",
    "src/projrot_io",
    "src/thermp_io",
    "src/varecof_io",
]

# Pixi configurations
[tool.pixi.workspace]
channels = ["conda-forge", "Auto-Mech"]
platforms = ["linux-64"]
preview = ["pixi-build"]

#   - Build
[tool.pixi.package] 
name = "autoio"

[tool.pixi.package.build] 
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.host-dependencies] 
hatchling = "==1.26.3"

[tool.pixi.package.run-dependencies] 
mako = ">=1.3.10"
more-itertools = ">=10.8.0"
numpy = ">=1.26"
pint = ">=0.25"
pyparsing = ">=3.2.5"
pyyaml = ">=6.0.3"
qcelemental = ">=0.29.0"
autochem = ">=0.2025.0,<2.0.0"

#   - Environments
[tool.pixi.pypi-dependencies]
autoio = { path = ".", editable = true }

[tool.pixi.dependencies]
mako = ">=1.3.10"
more-itertools = ">=10.8.0"
numpy = ">=1.26"
pint = ">=0.25"
pyparsing = ">=3.2.5"
pyyaml = ">=6.0.3"
qcelemental = ">=0.29.0"
autochem = ">=0.2025.0,<2.0.0"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.47.1"
bumpver = ">=2025.1131,<2026"

[tool.pixi.environments]
test = ["test"]
build = ["build"]

#   - Tasks
[tool.pixi.feature.test.tasks]
test-mess_io = "pytest -v src/mess_io"
test-autoparse = "pytest -v src/autoparse"
test-autoread = "pytest -v src/autoread"
test-autowrite = "pytest -v src/autowrite"
test-ioformat = "pytest -v src/ioformat"
test-chemkin_io = "pytest -v src/chemkin_io"
test-projrot_io = "pytest -v src/projrot_io"
test-polyrate_io = "pytest -v src/polyrate_io"
test-thermp_io = "pytest -v src/thermp_io"
test-onedmin_io = "pytest -v src/onedmin_io"
# Broken
test-pac99_io = "pytest -v src/pac99_io"
test-varecof_io = "pytest -v src/varecof_io"
test-autorun = "pytest -v src/autorun"
test-elstruct = "pytest -v src/elstruct"

[tool.pixi.feature.test.tasks.test-working]
depends-on = [
    "test-mess_io",
    "test-autoparse",
    "test-autoread",
    "test-autowrite",
    "test-ioformat",
    "test-chemkin_io",
    "test-projrot_io",
    "test-polyrate_io",
    "test-thermp_io",
    "test-onedmin_io",
]

[tool.pixi.feature.test.tasks.test]
depends-on = [
    "test-mess_io",
    "test-autoparse",
    "test-autoread",
    "test-autowrite",
    "test-ioformat",
    "test-chemkin_io",
    "test-projrot_io",
    "test-polyrate_io",
    "test-thermp_io",
    "test-onedmin_io",
    # Broken
    "test-pac99_io",
    "test-varecof_io",
    "test-autorun",
    "test-elstruct",
]

[tool.pixi.feature.build.tasks]
upload = "rattler-build upload anaconda -o Auto-Mech *.conda"
current-version = "bumpver show -n | awk -F': ' '/Current Version: / {print $2}'"

[tool.bumpver]
current_version = "0.2026.0"
version_pattern = "MAJOR.YYYY.PATCH"
commit_message = "Release {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = "scripts/update_lockfile.sh"
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]